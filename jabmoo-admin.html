<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>จับหมู — Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
body{margin:0;background:#08251b;font-family:sans-serif;color:#fff}
input,select{background:rgba(255,255,255,0.1);border:1px solid rgba(212,175,55,0.4);border-radius:8px;color:#fff;padding:7px 10px;font-size:13px;outline:none}
input::placeholder{color:#9ca3af}
button{cursor:pointer;border:none;border-radius:8px;font-weight:700}
table{border-collapse:collapse;width:100%}
th{font-size:10px;color:#d4af37;text-align:left;padding:6px 8px;cursor:pointer;user-select:none;white-space:nowrap}
td{font-size:12px;padding:7px 8px;border-top:1px solid #14532d;white-space:nowrap}
tr.row:hover{background:#0f3a2b;cursor:pointer}
.card{background:#0c3323;border:1px solid #1c5a3f;border-radius:12px;padding:12px}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ⚠️ เปลี่ยนรหัสผ่านตรงนี้ก่อนใช้จริง
var ADMIN_PIN="8888";
</script>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const SUPABASE_URL="https://kivamkangzuyjwfouusr.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_e4N4h_EupJMRg9rC3R8CGw_kgXZH7bI";
let _sb=null,_sbP=null;
function loadSupabase(){
  if(window.supabase&&window.supabase.createClient)return Promise.resolve(window.supabase);
  if(_sbP)return _sbP;
  const urls=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];
  _sbP=new Promise((res,rej)=>{let i=0;(function next(){
    if(i>=urls.length){rej(new Error("โหลด SDK ไม่ได้"));return;}
    const s=document.createElement("script");s.src=urls[i++];s.async=true;
    s.onload=()=>{window.supabase?res(window.supabase):next();};s.onerror=next;
    document.head.appendChild(s);})();});
  return _sbP;
}
async function db(){
  if(_sb)return _sb;
  const mod=await loadSupabase();
  _sb=mod.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  return _sb;
}
const XP_LEVELS=[[1,"หมูน้อย",0],[2,"หมูหัดวิ่ง",150],[3,"หมูรู้ทาง",400],[4,"นักล่าหมู",800],[5,"มือปราบ Q♠",1400],[6,"เขี้ยวลากดิน",3000],[7,"เจ้าพ่อ J♦",5000],[8,"มือวาง 10♣",7500],[9,"ขาใหญ่โต๊ะเขียว",10500],[10,"เซียนโต๊ะทอง",14000],[11,"เซียนเหนือเซียน",18500],[12,"จอมยุทธ์ไพ่",24000],[13,"ปรมาจารย์",31000],[14,"เหนือเมฆ",40000],[15,"เทพจับหมู",50000]];
const lvOf=xp=>{let lv=1;for(const L of XP_LEVELS)if(xp>=L[2])lv=L[0];else break;if(xp>=50000)lv=15+Math.floor((xp-50000)/10000);return lv;};
const pct=(n,d)=>d>0?Math.round(100*n/d):0;
const PIGS=["👑","😎","🏴‍☠️","🎩"];
const fmt=n=>(n||0).toLocaleString();
const ago=ts=>{if(!ts)return "-";const s=(Date.now()-new Date(ts).getTime())/1000;
  if(s<3600)return Math.floor(s/60)+" นาที";if(s<86400)return Math.floor(s/3600)+" ชม.";return Math.floor(s/86400)+" วัน";};

function Gate({onOk}){
  const [v,setV]=useState("");const [err,setErr]=useState(false);
  function go(){if(v===ADMIN_PIN){try{sessionStorage.setItem("jm-admin","1");}catch(e){}onOk();}else setErr(true);}
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div className="card" style={{width:260,textAlign:"center"}}>
        <div style={{fontSize:30}}>🐷🔐</div>
        <div style={{fontSize:14,fontWeight:800,color:"#fde68a",margin:"6px 0 12px"}}>จับหมู Admin</div>
        <input type="password" value={v} onChange={e=>{setV(e.target.value);setErr(false);}} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="PIN" style={{width:"100%",boxSizing:"border-box",textAlign:"center",marginBottom:10}}/>
        {err&&<div style={{fontSize:11,color:"#fca5a5",marginBottom:8}}>PIN ไม่ถูกต้อง</div>}
        <button onClick={go} style={{width:"100%",padding:9,background:"#d4af37",color:"#1a2e1a"}}>เข้าสู่ระบบ</button>
      </div>
    </div>
  );
}

function Stat({label,value,sub}){
  return (
    <div className="card" style={{flex:1,minWidth:110,textAlign:"center",padding:"10px 6px"}}>
      <div style={{fontSize:20,fontWeight:800,color:"#fde68a"}}>{value}</div>
      <div style={{fontSize:10,color:"#7a9b8c",marginTop:2}}>{label}{sub?<span style={{color:"#5dcaa5"}}> {sub}</span>:null}</div>
    </div>
  );
}

function Detail({p,onClose,onChanged}){
  const [busy,setBusy]=useState("");
  const [msg,setMsg]=useState("");
  async function run(label,fn){
    setBusy(label);setMsg("");
    try{await fn();setMsg("✓ สำเร็จ");onChanged();}
    catch(e){setMsg("✗ "+(e.message||"ผิดพลาด"));}
    setBusy("");
  }
  async function upd(fields){
    const c=await db();
    const {error}=await c.from("players").update({...fields,updated_at:new Date().toISOString()}).eq("code",p.code);
    if(error)throw error;
  }
  function rename(){
    const n=prompt("ชื่อใหม่:",p.name||"");
    if(n===null)return;
    run("rename",()=>upd({name:n.trim()}));
  }
  function addXp(){
    const n=prompt("เพิ่ม/ลด XP (ใส่ลบได้ เช่น -50):","90");
    if(n===null)return;
    const v=parseInt(n,10);
    if(isNaN(v))return alert("ตัวเลขไม่ถูกต้อง");
    run("xp",()=>upd({xp:Math.max(0,(p.xp||0)+v)}));
  }
  function resetStats(){
    if(!confirm("รีเซ็ตสถิติทั้งหมดของ "+(p.name||p.code)+" เป็น 0? (รหัสและชื่อคงเดิม)"))return;
    run("reset",()=>upd({xp:0,games:0,jd_won:0,jd_seen:0,qs_dodged:0,qs_seen:0,slams:0,superslams:0,quits:0,wins:0,rank_sum:0,rk_games:0}));
  }
  function del(){
    if(!confirm("ลบผู้เล่น "+(p.name||"ไม่มีชื่อ")+" ("+p.code+") ถาวร?"))return;
    if(!confirm("ยืนยันอีกครั้ง — ลบแล้วกู้ไม่ได้"))return;
    run("del",async()=>{
      const c=await db();
      const {error}=await c.from("players").delete().eq("code",p.code);
      if(error)throw error;
      onClose();
    });
  }
  const rows=[
    ["Level","Lv."+lvOf(p.xp||0)],["XP",fmt(p.xp)],["เกม",fmt(p.games)],
    ["ชนะ",fmt(p.wins)+" ("+pct(p.wins,p.rk_games)+"%)"],
    ["อันดับเฉลี่ย",(p.rk_games?((p.rank_sum||0)/p.rk_games).toFixed(2):"-")+(p.rk_games?" ("+fmt(p.rk_games)+"เกม)":"")],
    ["เก็บ J♦",pct(p.jd_won,p.jd_seen)+"% ("+fmt(p.jd_won)+"/"+fmt(p.jd_seen)+")"],
    ["หนี Q♠",pct(p.qs_dodged,p.qs_seen)+"% ("+fmt(p.qs_dodged)+"/"+fmt(p.qs_seen)+")"],
    ["Slam / Super",fmt(p.slams)+" / "+fmt(p.superslams)],
    ["หนีเกม",fmt(p.quits)],["อัปเดตล่าสุด",ago(p.updated_at)+"ที่แล้ว"]
  ];
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:99,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div onClick={e=>e.stopPropagation()} className="card" style={{width:"100%",maxWidth:360,border:"2px solid rgba(212,175,55,0.6)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
          <span style={{fontSize:26}}>{PIGS[(p.pig_id||0)%4]}</span>
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:800}}>{p.name||<span style={{color:"#7a9b8c"}}>ไม่มีชื่อ</span>}</div>
            <div style={{fontSize:12,color:"#fde68a",fontWeight:800,letterSpacing:2}}>🔑 {p.code}</div>
          </div>
          <button onClick={onClose} style={{background:"transparent",color:"#7a9b8c",fontSize:18}}>✕</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 10px",marginBottom:12}}>
          {rows.map((r,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:11,borderTop:"1px solid #14532d",padding:"4px 0"}}>
              <span style={{color:"#7a9b8c"}}>{r[0]}</span><span style={{fontWeight:700}}>{r[1]}</span>
            </div>
          ))}
        </div>
        {msg&&<div style={{fontSize:12,color:msg.startsWith("✓")?"#5dcaa5":"#fca5a5",marginBottom:8,textAlign:"center"}}>{msg}</div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          <button disabled={!!busy} onClick={rename} style={{padding:8,background:"rgba(255,255,255,0.12)",color:"#fff",fontSize:12}}>✏️ เปลี่ยนชื่อ</button>
          <button disabled={!!busy} onClick={addXp} style={{padding:8,background:"rgba(255,255,255,0.12)",color:"#fff",fontSize:12}}>⭐ ปรับ XP</button>
          <button disabled={!!busy} onClick={resetStats} style={{padding:8,background:"rgba(255,255,255,0.12)",color:"#fde68a",fontSize:12}}>♻️ รีเซ็ตสถิติ</button>
          <button disabled={!!busy} onClick={del} style={{padding:8,background:"rgba(185,28,28,0.35)",color:"#fca5a5",fontSize:12}}>🗑 ลบผู้เล่น</button>
        </div>
      </div>
    </div>
  );
}

function Dash(){
  const [rows,setRows]=useState(null);
  const [err,setErr]=useState("");
  const [q,setQ]=useState("");
  const [sort,setSort]=useState({k:"xp",d:-1});
  const [sel,setSel]=useState(null);
  const [loadedAt,setLoadedAt]=useState(null);
  async function load(){
    setErr("");
    try{
      const c=await db();
      const {data,error}=await c.from("players").select("*").order("xp",{ascending:false}).limit(500);
      if(error)throw error;
      setRows(data||[]);setLoadedAt(new Date());
      if(sel){const f=(data||[]).find(r=>r.code===sel.code);if(f)setSel(f);}
    }catch(e){setErr(e.message||"โหลดไม่สำเร็จ");}
  }
  useEffect(()=>{load();},[]);
  const view=useMemo(()=>{
    if(!rows)return [];
    let v=rows;
    if(q.trim()){const s=q.trim().toLowerCase();v=v.filter(r=>(r.name||"").toLowerCase().includes(s)||(r.code||"").toLowerCase().includes(s));}
    const {k,d}=sort;
    v=[...v].sort((a,b)=>{
      let av,bv;
      if(k==="winp"){av=pct(a.wins,a.rk_games);bv=pct(b.wins,b.rk_games);}
      else if(k==="avg"){av=a.rk_games?(a.rank_sum||0)/a.rk_games:99;bv=b.rk_games?(b.rank_sum||0)/b.rk_games:99;}
      else if(k==="jd"){av=pct(a.jd_won,a.jd_seen);bv=pct(b.jd_won,b.jd_seen);}
      else if(k==="qs"){av=pct(a.qs_dodged,a.qs_seen);bv=pct(b.qs_dodged,b.qs_seen);}
      else if(k==="upd"){av=new Date(a.updated_at||0).getTime();bv=new Date(b.updated_at||0).getTime();}
      else{av=a[k]||0;bv=b[k]||0;}
      if(typeof av==="string")return d*av.localeCompare(bv);
      return d*(av-bv);
    });
    return v;
  },[rows,q,sort]);
  function hd(k,label){
    const on=sort.k===k;
    return <th onClick={()=>setSort(on?{k,d:-sort.d}:{k,d:-1})}>{label}{on?(sort.d<0?" ▼":" ▲"):""}</th>;
  }
  const now=Date.now();
  const active24=rows?rows.filter(r=>r.updated_at&&now-new Date(r.updated_at).getTime()<86400000).length:0;
  const totGames=rows?rows.reduce((s,r)=>s+(r.games||0),0):0;
  const totXp=rows?rows.reduce((s,r)=>s+(r.xp||0),0):0;
  const totQuits=rows?rows.reduce((s,r)=>s+(r.quits||0),0):0;
  return (
    <div style={{maxWidth:960,margin:"0 auto",padding:"14px 12px 40px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <span style={{fontSize:22}}>🐷</span>
        <div style={{fontSize:16,fontWeight:800,color:"#fde68a",flex:1}}>จับหมู — Admin Dashboard</div>
        <span style={{fontSize:10,color:"#7a9b8c"}}>{loadedAt?("โหลดเมื่อ "+loadedAt.toLocaleTimeString()):""}</span>
        <button onClick={load} style={{padding:"7px 12px",background:"#d4af37",color:"#1a2e1a",fontSize:12}}>⟳ รีเฟรช</button>
      </div>
      {err&&<div className="card" style={{color:"#fca5a5",fontSize:12,marginBottom:10}}>⚠️ {err}</div>}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
        <Stat label="ผู้เล่นทั้งหมด" value={rows?rows.length:"…"}/>
        <Stat label="เล่นใน 24 ชม." value={rows?active24:"…"}/>
        <Stat label="เกมสะสมรวม" value={fmt(totGames)}/>
        <Stat label="XP แจกไปแล้ว" value={fmt(totXp)}/>
        <Stat label="หนีเกมรวม" value={fmt(totQuits)}/>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหาชื่อ / รหัส…" style={{flex:1}}/>
      </div>
      <div className="card" style={{padding:0,overflowX:"auto"}}>
        <table>
          <thead><tr>
            {hd("name","ผู้เล่น")}{hd("code","รหัส")}{hd("xp","XP")}{hd("games","เกม")}
            {hd("winp","ชนะ%")}{hd("avg","อันดับเฉลี่ย")}{hd("jd","J♦%")}{hd("qs","Q♠%")}
            {hd("slams","Slam")}{hd("superslams","⭐")}{hd("quits","🏃")}{hd("upd","ล่าสุด")}
          </tr></thead>
          <tbody>
            {view.map(r=>(
              <tr key={r.code} className="row" onClick={()=>setSel(r)}>
                <td>{PIGS[(r.pig_id||0)%4]} {r.name||<span style={{color:"#7a9b8c"}}>—</span>} <span style={{color:"#5dcaa5",fontSize:10}}>Lv.{lvOf(r.xp||0)}</span></td>
                <td style={{color:"#fde68a",fontWeight:700,letterSpacing:1}}>{r.code}</td>
                <td>{fmt(r.xp)}</td><td>{fmt(r.games)}</td>
                <td>{pct(r.wins,r.rk_games)}%</td>
                <td>{r.rk_games?((r.rank_sum||0)/r.rk_games).toFixed(2):"-"}</td>
                <td>{pct(r.jd_won,r.jd_seen)}%</td><td>{pct(r.qs_dodged,r.qs_seen)}%</td>
                <td>{fmt(r.slams)}</td><td>{fmt(r.superslams)}</td>
                <td style={{color:(r.quits||0)>0?"#fca5a5":"inherit"}}>{fmt(r.quits)}</td>
                <td style={{color:"#7a9b8c",fontSize:10}}>{ago(r.updated_at)}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {rows&&view.length===0&&<div style={{padding:16,fontSize:12,color:"#7a9b8c",textAlign:"center"}}>ไม่พบผู้เล่น</div>}
      </div>
      <div style={{fontSize:10,color:"#7a9b8c",marginTop:8}}>คลิกแถวเพื่อดูรายละเอียด / เปลี่ยนชื่อ / ปรับ XP / รีเซ็ต / ลบ</div>
      {sel&&<Detail p={sel} onClose={()=>setSel(null)} onChanged={load}/>}
    </div>
  );
}

function AdminApp(){
  const [ok,setOk]=useState(()=>{try{return sessionStorage.getItem("jm-admin")==="1";}catch(e){return false;}});
  return ok?<Dash/>:<Gate onOk={()=>setOk(true)}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<AdminApp/>);
</script>
</body>
</html>
