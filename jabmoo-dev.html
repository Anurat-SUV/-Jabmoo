// MC BUDGET BY TABLE (v0821.16 — layer 1 of the "bot gets smarter" plan).
// The MC search is TIME-bound early in a hand (a full 13-candidate rollout sweep
// costs far more than 700ms on a phone), so the bot at trick 1 was sampling only
// a handful of deals and picking on noise. Rollout error falls as 1/sqrt(deals),
// so buying more time is a real strength gain — we spend it where it matters:
// expensive tables get a bigger think, cheap/practice tables stay snappy.
// pace = the pre-play "human feel" pause; it shrinks as the think grows so total
// turn time stays ~1.35s and rich tables do not visibly crawl.
function mcBudget(mult){
  const m=mult||100;
  // v0821.17 remap (A: bots peak at x500) — x100 is the newbie pond, x500 is the shark tank.
  // Bot tables only exist at x100/200/500; anything higher (SEAT TAKEOVER subs) gets max.
  const t=m>=500?{ms:1800,deals:600}
        :m>=200?{ms:1100,deals:300}
        :       {ms:600 ,deals:110};
  return {ms:t.ms,deals:t.deals,pace:Math.max(200,1350-t.ms)};
}
function botPlayMC(hand,ls,tc,allWon,totals,myIdx,playLog,voids,budgetMs,maxDeals,opts){
  playLog=playLog||[];voids=voids||[{},{},{},{}];
  let vld=getValid(hand,ls,tc);
  // HARD RULE (mirrors heuristic v0719.1): following ♦ while J♦ is still unseen and
  // not in our hand → never spend Q/K/A♦ if a lower diamond exists. Early-game MC is
  // too noisy to learn this reliably, so we prune the candidates before sampling.
  if(ls==="♦"&&vld.length>1&&vld.every(c=>c.suit==="♦")){
    const jdGone=playLog.some(e=>e.card.suit==="♦"&&e.card.rank==="J")
      ||tc.some(t=>t.card.suit==="♦"&&t.card.rank==="J")
      ||hand.some(c=>c.suit==="♦"&&c.rank==="J");
    if(!jdGone){
      // J♦ COVER exception (v0821.24): trick-high < J + possible J♦ holder behind +
      // clean trick → KEEP the cheapest above-J card as a candidate alongside the
      // lows and let MC price cover-vs-duck; hard-banning it gifted last-position
      // players a free J♦ cash over a low lead.
      const dNowM=tc.filter(t=>t.card.suit==="♦").map(t=>RO[t.card.rank]);
      const hiNowM=dNowM.length?Math.max(...dNowM):0;
      const inTM=new Set(tc.map(t=>t.playerIdx));
      let jdBehindM=false;
      for(let i=1;i<4;i++){const sx=(myIdx+i)%4;if(!inTM.has(sx)&&!isVoid(voids,sx,"♦"))jdBehindM=true;}
      const penM=tc.reduce((sm,t)=>sm+cSc(t.card),0);
      const lows=vld.filter(c=>c.rank!=="Q"&&c.rank!=="K"&&c.rank!=="A");
      if(hiNowM<RO["J"]&&jdBehindM&&penM>=0&&lows.length>0){
        const covs=vld.filter(c=>RO[c.rank]>RO["J"]);
        if(covs.length){
          const cheap=covs.reduce((a,b)=>RO[a.rank]<RO[b.rank]?a:b);
          vld=lows.concat([cheap]);
        }else vld=lows;
      }else if(lows.length>0)vld=lows;
    }
  }
  // COVER GUARD (MC): holding Q♠ with A♠ unseen → never LEAD K♠ (burns the only
  // in-suit cover for our own pig and telegraphs it).
  if(!tc.length&&vld.length>1&&hand.some(c=>c.suit==="♠"&&c.rank==="Q")){
    const aSeenM=playLog.some(e=>e.card.suit==="♠"&&e.card.rank==="A")||hand.some(c=>c.suit==="♠"&&c.rank==="A");
    if(!aSeenM){
      const prKM=vld.filter(c=>!(c.suit==="♠"&&c.rank==="K"));
      if(prKM.length)vld=prKM;
    }
  }
  // HARD RULE: a loss-holder (pen ≤ −100 piled) never LEADS 10♣ — ducking opponents
  // send the ×2 straight back to double the damage.
  // WOUNDED HIGH-CLUB LEAD BAN (MC, v0815.8 — A's call, G2 T2): same loss-holder also
  // never LEADS any club ≥ 10 while 10♣ is live and not ours. A boss club (e.g. A♣)
  // wins for sure, and every opponent simply FOLLOWS with 10♣ to double our wounds —
  // rollouts are too noisy to price this reliably, so prune before sampling.
  // (Mirrors the heuristic lead filter; reverse rule — feeding 10♣ onto a wounded
  // certain winner — already exists in botPlay's club-follow logic.)
  if(!tc.length&&vld.length>1){
    const myPen=(allWon&&allWon[myIdx]?allWon[myIdx]:[]).reduce((t,c)=>t+Math.min(0,cSc(c)),0);
    if(myPen<=-100){
      const tenCLiveM=!playLog.some(e=>e.card.suit==="♣"&&e.card.rank==="10")&&!hand.some(c=>c.suit==="♣"&&c.rank==="10");
      const pr=vld.filter(c=>!(c.suit==="♣"&&(c.rank==="10"||(tenCLiveM&&RO[c.rank]>=RO["10"]))));
      if(pr.length)vld=pr;
    }
  }
  // J♦ FOLLOW DISCIPLINE (MC, v0815.9 — A's call, G1 T3): following ♦ with J♦ and
  // another diamond in hand, NEVER spend J♦ unless it is GUARANTEED to win here:
  // current winning ♦ below J, and (everyone still to act is ♦-void, or no unseen ♦
  // outranks J). Rollouts misprice the behind Q/K/A risk (deal noise), and a lost
  // J♦ hands +100 to an opponent. Mirrors the heuristic's follow logic exactly.
  if(ls==="♦"&&tc.length&&vld.length>1&&vld.some(c=>c.suit==="♦"&&c.rank==="J")){
    const curMaxD=tc.filter(t=>t.card.suit==="♦").reduce((m,t)=>Math.max(m,RO[t.card.rank]),0);
    const behindD=[1,2,3].map(i=>(myIdx+i)%4).filter(sx=>!tc.some(t=>t.playerIdx===sx));
    const behindAllVoidD=behindD.every(sx=>voids[sx]&&voids[sx]["♦"]);
    const seenAboveJ=r=>playLog.some(e=>e.card.suit==="♦"&&e.card.rank===r)||tc.some(t=>t.card.suit==="♦"&&t.card.rank===r)||hand.some(c=>c.suit==="♦"&&c.rank===r);
    const jBossD=["Q","K","A"].every(seenAboveJ);
    const jGuaranteed=curMaxD<RO["J"]&&(behindD.length===0||behindAllVoidD||jBossD);
    if(!jGuaranteed){
      const prJ=vld.filter(c=>!(c.suit==="♦"&&c.rank==="J"));
      if(prJ.length)vld=prJ;
    }
  }
  // HARD RULE: never gift 10♣ (×2) or J♦ (+100) as a losing card into a trick
  // currently won by a slam-threat player (≥10 hearts piled) — their pile flips positive.
  if(tc.length&&vld.length>1){
    const w0=trickWin(tc,ls);
    const wH=(allWon&&allWon[w0]?allWon[w0]:[]).filter(c=>c.suit==="♥").length;
    const wNet=(allWon&&allWon[w0]?allWon[w0]:[]).reduce((t,c)=>t+cSc(c),0)
      +tc.reduce((t,x)=>t+cSc(x.card),0); // + score cards already in the trick (they go to the winner)
    // J♦-LIVE DIAMOND BAN (MC, v0812.4): ♦-led, J♦ unseen, players still behind →
    // a yet-to-act J♦ wins the trick and our discarded 10♣ doubles his +100 to +200.
    if(ls==="♦"&&tc.length<3
      &&tc.filter(t=>t.card.suit==="♦").reduce((m,t)=>Math.max(m,RO[t.card.rank]),0)<RO["J"]
      &&[1,2,3].some(i=>{const sx=(myIdx+i)%4;return !tc.some(t=>t.playerIdx===sx)&&!(voids[sx]&&voids[sx]["♦"]);})){
      // (narrowed: only while the winning diamond is BELOW J — a behind J♦ can
      // overtake and win; with Q/K/A winning nobody ducks J♦ voluntarily, and a
      // blanket ban froze 10♣ through most early ♦ tricks, bench −3.4)
      const jdSeenM=playLog.some(e=>e.card.suit==="♦"&&e.card.rank==="J")
        ||tc.some(t=>t.card.suit==="♦"&&t.card.rank==="J")
        ||hand.some(c=>c.suit==="♦"&&c.rank==="J");
      if(!jdSeenM){
        const prJT=vld.filter(c=>!(c.suit==="♣"&&c.rank==="10"));
        if(prJT.length)vld=prJT;
      }
    }
    // winner's pile net-positive (banked or in-trick J♦): giving them 10♣ doubles their profit
    if(w0!==myIdx&&wNet>0&&vld.length>1){
      const hiLedP=tc.some(t=>t.card.suit===ls)?Math.max(...tc.filter(t=>t.card.suit===ls).map(t=>RO[t.card.rank])):0;
      const losingP=c=>c.suit!==ls||RO[c.rank]<hiLedP;
      const prP=vld.filter(c=>!(c.suit==="♣"&&c.rank==="10"&&losingP(c)));
      if(prP.length)vld=prP;
    }
    // DISCARD HEART CONTAINMENT (MC, v0812.3): winner sole-owns ALL captured
    // hearts (≥4) → hearts are frozen as discards (they can never win a non-♥
    // trick → always land on the budding slammer). Split ownership lifts it.
    if(ls!=="♥"&&w0!==myIdx){
      const hOwnM=allWon.map((w,i)=>w.some(c=>c.suit==="♥")?i:-1).filter(i=>i>=0);
      const capAllM=allWon.reduce((s,w)=>s+w.filter(c=>c.suit==="♥").length,0);
      if(hOwnM.length===1&&hOwnM[0]===w0&&capAllM>=4){
        const prH=vld.filter(c=>c.suit!=="♥");
        if(prH.length)vld=prH;
      }
    }
    if(w0!==myIdx&&wH>=10){
      const hiLed=tc.some(t=>t.card.suit===ls)?Math.max(...tc.filter(t=>t.card.suit===ls).map(t=>RO[t.card.rank])):0;
      const losing=c=>c.suit!==ls||RO[c.rank]<hiLed;
      let pr=vld.filter(c=>!(c.suit==="♣"&&c.rank==="10"&&losing(c)));
      if(pr.length)vld=pr;
      pr=vld.filter(c=>!(c.suit==="♦"&&c.rank==="J"&&losing(c)));
      if(pr.length)vld=pr;
      // Q♠: deny only while 788 is still live — if any special card already went
      // to another player, giving the slammer the pig costs him a clean −100.
      const otherSp=allWon.some((w,i)=>i===w0?false:w.some(c=>(c.suit==="♠"&&c.rank==="Q")||(c.suit==="♦"&&c.rank==="J")||(c.suit==="♣"&&c.rank==="10")));
      if(!otherSp){
        pr=vld.filter(c=>!(c.suit==="♠"&&c.rank==="Q"&&losing(c)));
        if(pr.length)vld=pr;
      }
    }
  }
  // PIG EXIT (force): following spades holding Q♠ with a HIGHER spade already in
  // the trick — Q♠ is guaranteed to land on another player. Once K/A♠ are gone the
  // pig becomes the boss spade and can only come back to us; an in-suit shed under
  // a bigger spade is the last cheap exit, so take it. (Exception: a critical
  // slammer with 788 live who hasn't played this trick yet could overtake and
  // CAPTURE it — then don't force; the containment prune above already removed Q♠
  // when the slammer is currently winning.)
  {
    const qEx=vld.find(c=>c.suit==="♠"&&c.rank==="Q");
    // two guaranteed-to-lose pig exits: (a) following ♠ under a higher spade,
    // (b) DISCARDING while void in the led suit (Q♠ can never win the trick).
    const inSuitShed=ls==="♠"&&tc.some(t=>t.card.suit==="♠"&&RO[t.card.rank]>RO["Q"]);
    const discarding=!!ls&&ls!=="♠"&&!hand.some(c=>c.suit===ls);
    if(qEx&&tc.length&&(inSuitShed||discarding)){
      const hb2=allWon.map(w=>w.filter(c=>c.suit==="♥").length);
      const cap2=hb2.reduce((a,b)=>a+b,0);
      let crit=-1;hb2.forEach((h,i)=>{if(i!==myIdx&&h>=10&&h===cap2)crit=i;});
      const critSafe=crit<0||tc.some(t=>t.playerIdx===crit)
        ||allWon.some((w,i)=>i===crit?false:w.some(c=>(c.suit==="♠"&&c.rank==="Q")||(c.suit==="♦"&&c.rank==="J")||(c.suit==="♣"&&c.rank==="10")));
      // A's refinement: if we hold enough LOW-spade escorts to duck every spade
      // lead the enemies could still make, holding the pig for a TARGETED discard
      // is stronger (we choose who eats it) — only force the dump when we could
      // get flushed (escorts after this trick < enemy spades remaining).
      const escortsAfter=hand.filter(c=>c.suit==="♠"&&RO[c.rank]<RO["Q"]).length-(inSuitShed?1:0);
      const seenSp=new Set();
      hand.forEach(c=>{if(c.suit==="♠")seenSp.add(c.key);});
      playLog.forEach(e=>{if(e.card.suit==="♠")seenSp.add(e.card.key);});
      tc.forEach(t=>{if(t.card.suit==="♠")seenSp.add(t.card.key);});
      let enemySp=0;for(const r of RANKS){if(!seenSp.has(r+"♠"))enemySp++;}
      const canHideForever=escortsAfter>=enemySp;
      if(critSafe&&!canHideForever)vld=[qEx];
    }
  }
  // EARLY HEART CONTEST (force, v0812.2): slam-threat detection needs ≥5 single-
  // owned captured hearts, so the FIRST heart tricks had ZERO defense — a mere 7♥
  // lead swept every time (A's G1 T1 log: bots ducked 5/3/4 under a 7). While
  // captured hearts are still single-owned (<5, pre-threat) and the heart LEADER is
  // winning, a clean-pile bot that can take the trick cheaply with a MID heart
  // (5-10) is forced to contest: it either eats a tiny pile (splits ownership →
  // slam dead forever, and dodges the −50 no-score rule) or a later player
  // overtakes (split anyway). Never with J+ (breakers) or 2-4 (duck guards); never
  // when a yet-to-act player is void in ♥ (Q♠ dump risk); never into a trick
  // already carrying net cost ≥50. Once someone other than the leader is winning,
  // ownership will split on its own — no force.
  if(ls==="♥"&&tc.length&&vld.length>1){
    const hbE=allWon.map(w=>w.filter(c=>c.suit==="♥").length);
    const capE=hbE.reduce((a,b)=>a+b,0);
    const ownersE=allWon.map((w,i)=>w.some(c=>c.suit==="♥")?i:-1).filter(i=>i>=0);
    const preThreat=capE<5&&(ownersE.length===0||(ownersE.length===1&&ownersE[0]!==myIdx));
    const myCleanE=!(allWon[myIdx]||[]).some(c=>isSC(c));
    if(preThreat&&myCleanE){
      const htE=tc.filter(t=>t.card.suit==="♥");
      const wCardE=htE.length?htE.reduce((h,t)=>RO[t.card.rank]>RO[h.rank]?t.card:h,htE[0].card):null;
      const wEntryE=wCardE?tc.find(t=>t.card===wCardE):null;
      const leaderWinningE=!!wEntryE&&wEntryE.playerIdx===tc[0].playerIdx;
      const trickCostE=-tc.reduce((s,t)=>s+cSc(t.card),0);
      const playedE=new Set(tc.map(t=>t.playerIdx));
      let dumpRiskE=false;
      for(let i=1;i<4;i++){const s=(myIdx+i)%4;if(!playedE.has(s)&&voids[s]&&voids[s]["♥"])dumpRiskE=true;}
      if(leaderWinningE&&trickCostE<50&&!dumpRiskE){
        const midsE=vld.filter(c=>c.suit==="♥"&&RO[c.rank]>RO[wCardE.rank]&&RO[c.rank]>=5&&RO[c.rank]<=10);
        if(midsE.length)vld=[midsE.reduce((a,b)=>RO[a.rank]<RO[b.rank]?a:b)];
      }
    }
  }
  // ANTI-SLAM: following hearts under a live threat (one player owns ALL captured
  // hearts, ≥5) with the slammer winning and no way to beat — never burn our top
  // heart (J+): it is a future slam-breaker. Prune it from MC candidates.
  if(ls==="♥"&&vld.length>1&&vld.every(c=>c.suit==="♥")){
    const hb=allWon.map(w=>w.filter(c=>c.suit==="♥").length);
    const capH=hb.reduce((a,b)=>a+b,0);
    let th=-1;hb.forEach((h,i)=>{if(i!==myIdx&&h>=5&&h===capH)th=i;});
    if(th>=0){
      const ht=tc.filter(t=>t.card.suit==="♥");
      const wCard=ht.length?ht.reduce((h,t)=>RO[t.card.rank]>RO[h.rank]?t.card:h,ht[0].card):null;
      const wEntry=wCard?tc.find(t=>t.card===wCard):null;
      const wIdx=wEntry?wEntry.playerIdx:(tc[0]?tc[0].playerIdx:-1);
      const canBeat=wCard?vld.some(c=>RO[c.rank]>RO[wCard.rank]):false;
      if(wIdx===th&&!canBeat){
        const sorted=[...vld].sort((a,b)=>RO[a.rank]-RO[b.rank]);
        const top=sorted[sorted.length-1];
        if(RO[top.rank]>=11){const pr=vld.filter(c=>c.key!==top.key);if(pr.length)vld=pr;}
      }
    }
  }
  // SLAM DEFENSE (v0821.33 — opts.slamDef): risk read once per decision.
  const sdCfg=(opts&&opts.slamDef)?(opts.slamDef===true?{thr:0.5,pen:150,hW:3}:Object.assign({thr:0.5,pen:150,hW:3},opts.slamDef)):null;
  const sdHum=opts?(opts.slamHumans||opts.humans||(opts.bayes&&opts.bayes.humans)||null):null;
  const sr=sdCfg?slamRisk(allWon,playLog,tc,voids,myIdx,sdHum):null;
  const slamOn=!!(sr&&sr.r>=sdCfg.thr);
  // STOPPER KEEP: under live risk, when DISCARDING (void in the led suit) never throw
  // away a BOSS card (outranks every unseen card of its suit) of a suit the slammer
  // still follows — it is a guaranteed trick later = the stopper that eats one heart.
  if(slamOn&&ls&&!hand.some(c=>c.suit===ls)&&vld.length>1){
    const seenS=new Set();hand.forEach(c=>seenS.add(c.key));playLog.forEach(e=>seenS.add(e.card.key));tc.forEach(t=>seenS.add(t.card.key));
    const bossS=c=>{for(const r of RANKS){if(RO[r]>RO[c.rank]&&!seenS.has(r+c.suit))return false;}return true;};
    const keep=vld.filter(c=>!(c.suit!=="♥"&&bossS(c)&&!(voids[sr.seat]&&voids[sr.seat][c.suit])));
    if(keep.length)vld=keep;
  }
  // FEED BAN: discarding into a trick the suspect currently wins → never a heart (the
  // old containment needed a ≥4-heart pile; under a live tell the ban starts at 0).
  if(slamOn&&ls&&ls!=="♥"&&tc.length&&!hand.some(c=>c.suit===ls)&&vld.length>1&&trickWin(tc,ls)===sr.seat){
    const nh=vld.filter(c=>c.suit!=="♥");if(nh.length)vld=nh;
  }
  // BREAKER KEEP: following ♥ with the suspect winning and nothing that beats him →
  // play the LOWEST heart. Dumping Q♥/J♥ under his A♥ "safely" hands him the very
  // cards that would have been boss once his A/K are gone (the slam-sealing mistake).
  if(slamOn&&ls==="♥"&&tc.length&&vld.length>1&&vld.every(c=>c.suit==="♥")){
    const topH=Math.max(...tc.filter(t=>t.card.suit==="♥").map(t=>RO[t.card.rank]));
    if(trickWin(tc,ls)===sr.seat&&!vld.some(c=>RO[c.rank]>topH))vld=[vld.reduce((a,b)=>RO[a.rank]<RO[b.rank]?a:b)];
  }
  if(vld.length===1)return vld[0];
  budgetMs=budgetMs||700;
  const capDeals=maxDeals||200;
  const start=Date.now();
  // unseen cards = full deck minus my hand and everything in playLog (incl. current trick)
  const seen=new Set();
  hand.forEach(c=>seen.add(c.key));
  playLog.forEach(e=>seen.add(e.card.key));
  tc.forEach(t=>seen.add(t.card.key));
  const unseen=[];
  for(const s of SUITS)for(const r of RANKS){const k=r+s;if(!seen.has(k))unseen.push({rank:r,suit:s,key:k});}
  const playedBy=[0,0,0,0];
  playLog.forEach(e=>{playedBy[e.pi]++;});
  const counts=[0,1,2,3].map(p=>p===myIdx?0:13-playedBy[p]);
  const wt0=allWon.map(a=>(a.length/4)|0);
  const qsW=(opts&&opts.bayes)?bayesQsWeights(hand,tc,playLog,voids,myIdx,opts.bayes.humans):null;
  const hW=slamOn?[0,1,2,3].map(p=>p===sr.seat?sdCfg.hW:1):null;
  const sums=vld.map(()=>0),ns=vld.map(()=>0);
  while(Date.now()-start<budgetMs){
    const dealHands=mcDeal(unseen,counts,voids,qsW,hW);
    for(let ci=0;ci<vld.length;ci++){
      const hs=[0,1,2,3].map(p=>p===myIdx?hand.filter(c=>c.key!==vld[ci].key):dealHands[p].slice());
      const wc=allWon.map(a=>a.slice());
      const wt=wt0.slice();
      const vds=voids.map(v=>({...v}));
      let plog=playLog.slice();
      let trick=tc.map(t=>({playerIdx:t.playerIdx,card:t.card}));
      const myLs=trick.length?trick[0].card.suit:null;
      if(myLs&&vld[ci].suit!==myLs)vds[myIdx][myLs]=true;
      trick.push({playerIdx:myIdx,card:vld[ci]});
      plog=plog.concat([{pi:myIdx,card:vld[ci]}]);
      let cur=(myIdx+1)%4,guard=0;
      while(guard++<80){
        if(trick.length===4){
          const ls0=trick[0].card.suit;
          const w=trickWin(trick,ls0);
          for(const t of trick)if(isSC(t.card))wc[w].push(t.card); // real engine stores SCORE cards only
          wt[w]++;cur=w;trick=[];
          if(hs.every(h=>h.length===0))break;
          continue;
        }
        if(hs[cur].length===0)break;
        const ls2=trick.length?trick[0].card.suit:null;
        const card=(slamOn&&cur===sr.seat)?slammerPolicy(hs[cur],ls2,trick,wc,totals,cur,plog,vds):botPlay(hs[cur],ls2,trick,wc,totals,cur,plog,vds);
        if(!card)break;
        hs[cur]=hs[cur].filter(c=>c.key!==card.key);
        if(ls2&&card.suit!==ls2)vds[cur][ls2]=true;
        trick.push({playerIdx:cur,card});
        plog.push({pi:cur,card});
        cur=(cur+1)%4;
      }
      const sc=[0,1,2,3].map(p=>calcScore(wc[p],wt[p]));
      const others=(sc[0]+sc[1]+sc[2]+sc[3]-sc[myIdx])/3;
      let val=sc[myIdx]-others;
      // SACRIFICE OBJECTIVE (v0821.33): a rollout where the suspect completes the slam
      // costs extra on top of the raw swing — MC then hunts for the split by itself.
      if(slamOn&&sc[sr.seat]>=194)val-=sdCfg.pen;
      // หลัก-AWARE OBJECTIVE (v0821.33 — A: +50 for me vs pushing a victim −150→−300
      // look identical in raw points but differ by 2 หลัก in coins). Blend the raw
      // swing with the coin payout of the running match totals: pay = 4×หลักฉัน − Σหลัก
      // (×100/3 puts it on the raw-points scale). MC now defends its own band edge and
      // presses opponents hanging just above theirs. opts.hlak=true → w=0.5, or a weight.
      if(opts&&opts.hlak){
        const hw=opts.hlak===true?0.5:opts.hlak;
        const hs4=[0,1,2,3].map(p=>toHsoft((totals[p]||0)+sc[p]));
        const pay=(4*hs4[myIdx]-(hs4[0]+hs4[1]+hs4[2]+hs4[3]))*100/3;
        val=(1-hw)*val+hw*pay;
      }
      // ANTI-LAST OBJECTIVE (opts.antiLast — layer 3): payout is spread-based but rank
      // still matters (XP/บ๊วย). Rollouts that leave us strictly last on running match
      // totals eat a flat penalty, steering MC away from lines that save a few points
      // now but cement 4th place.
      if(opts&&opts.antiLast){
        const mt=[0,1,2,3].map(p=>(totals[p]||0)+sc[p]);
        let last=true;for(let p=0;p<4;p++)if(p!==myIdx&&mt[p]<=mt[myIdx]){last=false;break;}
        if(last)val-=60;
      }
      if(opts&&opts.blowGuard){
        // BLOW-UP GUARD (v0821.23 — the actual wound from the Kob logs): the linear
        // objective prices −600→−800 the same as 0→−200, so MC happily trades a small
        // mean gain for tail-explosion risk — exactly the tail strong players farm
        // (they win with score ~0 by detonating one bot per game). Make the utility
        // CONCAVE: every rollout point below the floor (running match total) hurts
        // extra, steering MC toward dumping dangerous high cards early instead of
        // clinging to them for petty trick EV. Tunable via remote config:
        // blowGuard:true → {floor:-400,slope:0.5}, or pass {floor,slope} directly.
        const bg=opts.blowGuard===true?{floor:-400,slope:0.5}:opts.blowGuard;
        const bt=(totals[myIdx]||0)+sc[myIdx];
        if(bt<bg.floor)val-=(bg.floor-bt)*bg.slope;
      }
      sums[ci]+=val;ns[ci]++;
    }
    if(ns[0]>=capDeals)break;
  }
  let best=0,bv=-1e9;
  for(let i=0;i<vld.length;i++){
    const v=ns[i]?sums[i]/ns[i]:-1e9;
    if(v>bv){bv=v;best=i;}
  }
  // SPADE HUNT tie-break (opts.hunt — layer 2) + SPADE CAMPAIGN (opts.campaign,
  // v0821.32 — A: "กับเพื่อน การไล่มันต่อเนื่องและรุมกัน"). Base rule unchanged:
  // to OPEN a hunt we need A/K control + >=2 spades. The campaign extension fixes
  // the three gaps vs a human table: (1) NOT sustained — each ♠ lead already made
  // while Q is live ("heat", read from the shared public log) WIDENS the tie-break
  // margin 8 -> up to 20, so a started siege tends to be pressed home; (2) NOT
  // cooperative — heat counts ANYONE's ♠ leads, human or bot, so every campaign
  // bot joins an open siege without any bot-to-bot messaging; (3) joining an
  // already-open siege needs no A/K control — leading a low spade you can't win
  // with is free pressure. หมูเทพ runs the campaign only ~half of games (huntP,
  // rolled once per game from match totals — sticky within a game, so it commits
  // or abstains coherently instead of flickering). Withdraws the moment Q♠ shows.
  if(opts&&opts.hunt&&!ls){
    const qsSeen=playLog.some(e=>e.card.suit==="♠"&&e.card.rank==="Q");
    const iHoldQ=hand.some(c=>c.suit==="♠"&&c.rank==="Q");
    const myS=hand.filter(c=>c.suit==="♠");
    if(!qsSeen&&!iHoldQ&&myS.length){
      const canOpen=myS.length>=2&&myS.some(c=>c.rank==="A"||c.rank==="K");
      let heat=0,joined=true,TIE=8;
      if(opts.campaign){
        // v0821.33 TARGET GATE (option B — fair to humans and bots alike): the siege
        // needs a victim. qsPosterior = ♠-voids + hand sizes (everyone) × human tells
        // (bayes, humans only); campaign only while ONE seat is likelier than campQ
        // (default 0.5) to hold Q♠. No target → plain margin-8 controller hunt.
        const post=qsPosterior(hand,tc,playLog,voids,myIdx,opts.humans||(opts.bayes&&opts.bayes.humans)||null);
        let pm=0;if(post)for(let p=0;p<4;p++)if(post[p]>pm)pm=post[p];
        const campQ=opts.campQ!=null?opts.campQ:0.5;
        if(!(post&&pm>=campQ))joined=false;
        const nT=(playLog.length/4)|0;
        for(let t=0;t<nT;t++)if(playLog[t*4].card.suit==="♠")heat++;
        if(opts.huntP!=null&&opts.huntP<1){ // per-game sticky roll (hash of totals+seat)
          let h=(myIdx+1)|0;
          for(let p=0;p<4;p++){h=(Math.imul(h,31)+((totals[p]|0)+1009))|0;}
          h^=h>>>13;h=Math.imul(h,0x5bd1e995);h^=h>>>15;
          joined=((h>>>0)%100)<opts.huntP*100;
        }
        // v0821.32b (bench chunk 1: -95/game — margins were runaway): the siege
        // self-reinforced forever (heat only grows) at up to 20pts of accepted EV
        // loss, and control-less joiners bled points whose payoff lands on whoever
        // holds A/K. Refined: controller margin caps at 16, joiner at 12, and
        // heat>=3 with Q STILL unseen = the holder is long (A's 5-spade rule) →
        // stand down to the plain margin-8 controller hunt.
        if(joined&&heat>0&&heat<3)TIE=8+(canOpen?Math.min(8,4*heat):Math.min(4,2*heat));
      }
      const joinOpen=opts.campaign&&joined&&heat>0&&heat<3; // open siege — low spades suffice (until it stalls)
      if((canOpen&&(!opts.campaign||joined||heat===0))||joinOpen){
        // note: a non-joined หมูเทพ still keeps the ORIGINAL margin-8 hunt (canOpen path)
        let hi=-1,hr=99;
        for(let i=0;i<vld.length;i++){
          const c=vld[i];
          if(c.suit!=="♠"||RO[c.rank]>=RO["Q"])continue; // low spades only — never lead into the pig
          const v=ns[i]?sums[i]/ns[i]:-1e9;
          if(v>=bv-TIE&&RO[c.rank]<hr){hr=RO[c.rank];hi=i;}
        }
        if(hi>=0)return vld[hi];
      }
    }
  }
  // Tie-break: when the top choices are within noise margin, defer to the heuristic bot.
  // MC can't tell "equally lost" positions apart (e.g. a doomed J♦) and picks randomly,
  // which looks dumb to humans — the heuristic keeps sensible card order in those spots.
  const hCard=botPlay(hand,ls,tc,allWon,totals,myIdx,playLog,voids);
  if(hCard){
    const hIdx=vld.findIndex(c=>c.key===hCard.key);
    if(hIdx>=0&&hIdx!==best&&ns[hIdx]){
      const hv=sums[hIdx]/ns[hIdx];
      if(bv-hv<=10)return vld[hIdx];
    }
  }
  return vld[best];
}

function levelInfo(xp){
  let cur=XP_LEVELS[0],next=null;
  for(const Lv of XP_LEVELS){if(xp>=Lv[2])cur=Lv;else{next=Lv;break;}}
  if(!next){const e=Math.floor((xp-50000)/10000);cur=[15+e,"👑 เทพจับหมู"+(e>0?" +"+e:""),50000+e*10000];next=[16+e,"",50000+(e+1)*10000];}

}
function pct(n,d){return d>0?Math.round(100*n/d):0;}

function Setup({onStart,onOnline,lang,setLang,prof,onRename,onShowCode,onShowHall,coins,coinMsg}){
  const [tblIdx,setTblIdx]=useState(0); // offline table tier (bots → bot:true tiers only)
  const tblTouched=useRef(false); // manual pick wins over the last-played default
  useEffect(()=>{ // v0821.22: default to last-played table, clamped down to affordability
    if(tblTouched.current||typeof COIN_TABLES==="undefined")return;
    const i=COIN_TABLES.findIndex(t=>t.mult===lastTblMult(coins,true));
    if(i>=0)setTblIdx(i);
  },[coins]);
  const [showRules,setShowRules]=useState(false);
  const [showHowTo,setShowHowTo]=useState(false);
  const [nm,setNm]=useState([(prof&&prof.name)||"","","",""]);
  const [showCoinHist,setShowCoinHist]=useState(false);
  useEffect(()=>{ // profile name is the source of truth for seat 1
    const n=(prof&&prof.name)||"";
    setNm(m=>m[0]===n?m:[n,m[1],m[2],m[3]]);
  },[prof&&prof.name]);
  const [isBot,setIsBot]=useState([false,true,true,true]);
  const [lv,setLv]=useState([3,3,3,3]); // single smartest level; picker hidden
  const [em,setEm]=useState("8games");
  const [th,setTh]=useState(500);
  const [numGames,setNumGames]=useState(8);
  const [showSec,setShowSec]=useState(3);
  const L=lang==="th";
  const hasName=!!(prof&&prof.name&&prof.name.trim());
  function start(){
    if(!hasName){onShowCode();return;}
    // validate tier at start (balance may have dropped since selection)
    const tt=(typeof COIN_TABLES!=="undefined"&&COIN_TABLES[tblIdx])||null;
    const okT=tt&&tt.bot&&(tt.min===0||(coins!=null&&coins>=tt.min))?tt:null;
    try{localStorage.setItem("jm_lastTbl",String(okT?okT.mult:100));}catch(e){} // remember for next session
    const _lu=seededShuffle(botLineup(okT?okT.mult:100),(Math.random()*1e9)|0); // character mix per tier, random seats per match
    onStart({
      players:nm.map((n,i)=>{
        const bid=(i>0&&isBot[i])?_lu[(i-1)%_lu.length]:null;
        return {name:i===0?((prof&&prof.name)||n||(L?"คุณ":"You")):(n||(bid?botChar(bid).name:"P"+(i+1))),isBot:i===0?false:isBot[i],botLevel:lv[i],botChar:bid||undefined};
      }),
      endMode:em,threshold:th,numGames,showSec,coinMult:okT?okT.mult:100
    });
  }
  function startPractice(){
    if(!hasName){onShowCode();return;}
    // PRACTICE: 1 short game vs easy (Lv1 heuristic) bots. cfg.practice=true makes the
    // app skip stats/coin/savegame entirely and turns on in-game coaching (tips + hint).
    onStart({
      players:[{name:(prof&&prof.name)||"คุณ",isBot:false,botLevel:0},
               {name:"ครูหมู 1",isBot:true,botLevel:1},
               {name:"ครูหมู 2",isBot:true,botLevel:1},
               {name:"ครูหมู 3",isBot:true,botLevel:1}],
      endMode:"8games",threshold:1000,numGames:1,showSec:3,coinMult:100,practice:true
    });
  }
  return (
    <div className="vh100" style={{background:LANDING_V2?"#160c04":"#f0f1f3",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"0.6rem",overflowY:"auto"}}>
      <div style={{width:"100%",maxWidth:440,background:LANDING_V2?"linear-gradient(180deg,#5c3a1e,#3e2413)":"#fff",borderRadius:16,padding:"0.9rem",border:LANDING_V2?"2px solid #b4831a":"1px solid #e5e7eb",boxShadow:"0 4px 24px rgba(0,0,0,0.35)",marginTop:"0.2rem",marginBottom:"0.2rem"}}>
        {LANDING_V2?(
          <div style={{margin:"-0.9rem -0.9rem 0.8rem",padding:"0.7rem 0.8rem 0.2rem",borderRadius:"16px 16px 0 0",position:"relative",overflow:"hidden",
            background:"linear-gradient(180deg,#7ec3ee 0%,#4b93d6 40%,#2f6db8 100%)"}}>
            {/* v0821.29-dev NEW LANDING (A's mock, real assets): sky header, big logo +
                pig + card fan, image menu cards. Handlers identical to the old landing. */}
            <div style={{position:"relative",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{display:"flex",gap:4,background:"rgba(0,0,0,0.3)",borderRadius:8,padding:3}}>
                {["th","en"].map(l=>(
                  <button key={l} onClick={()=>setLang(l)} style={{padding:"2px 10px",borderRadius:6,border:"none",cursor:"pointer",fontSize:11,fontWeight:800,background:lang===l?"#fbbf24":"transparent",color:lang===l?"#3a2a00":"#e0ecf7"}}>{l.toUpperCase()}</button>
                ))}
              </div>
              {COIN_ON&&(
                <div onClick={()=>{if(prof)setShowCoinHist(true);else onShowCode();}} style={{display:"flex",alignItems:"center",gap:5,background:"linear-gradient(180deg,#241203,#3e2413)",border:"2px solid #b4831a",borderRadius:999,padding:"3px 6px 3px 9px",cursor:"pointer",boxShadow:"0 2px 0 #241203"}}>
                  <span style={{fontSize:13}}>🪙</span>
                  <span style={{fontSize:14,fontWeight:900,color:"#ffe9a8",fontFamily:"Georgia,serif"}}>{coins!=null?coins.toLocaleString():"..."}</span>
                  <span style={{width:19,height:19,borderRadius:"50%",background:"radial-gradient(circle at 35% 30%,#9be26b,#3f9e2a)",color:"#fff",display:"grid",placeItems:"center",fontWeight:800,fontSize:13,border:"1.5px solid #2a6e1a"}}>+</span>
                </div>
              )}
            </div>
            <img src={JM_LOGO} alt="จับหมู" style={{display:"block",width:"96%",margin:"2px auto 0",filter:"drop-shadow(0 4px 8px rgba(0,0,0,0.35))"}}/>

            <span style={{fontSize:14,color:"#9ca3af",fontWeight:700,width:18}}>{i+1}</span>
            <input value={nm[i]} onChange={e=>{const n=[...nm];n[i]=e.target.value;setNm(n);}}

              style={{flex:1,minWidth:70,background:"#fff",border:"1px solid #d1d5db",borderRadius:6,padding:"5px 9px",color:"#111827",fontSize:14,outline:"none"}}/>
            {i>0 && (
              <button onClick={()=>{const b=[...isBot];b[i]=!b[i];setIsBot(b);}}
                style={{fontSize:12,padding:"4px 10px",borderRadius:6,border:"1.5px solid",borderColor:isBot[i]?"#3b82f6":"#d1d5db",background:isBot[i]?"#3b82f6":"#fff",color:isBot[i]?"#fff":"#374151",cursor:"pointer",fontWeight:600}}>
                {isBot[i]?"Bot":"Human"}
              </button>
            )}
            {/* bot level picker hidden — all bots use the single smartest level (lv state) */}
          </div>
        ))}

        {/* v0821.28-dev: "จบเกมเมื่อ" + "แสดงไพ่หลังจบตา" merged onto one row so the
            online button rises above the fold (no scroll needed to see it) */}
        {/* v0821.34 (A's mock): three gold setting cards — icon / label / value / chevron.
            A native <select> sits invisibly over each card so a tap opens the OS picker.
            Card 1 merges end-mode + threshold: "จำนวนเกม" or 500/700/900/1K. Card 2 dims
            when the match ends by score (value still kept). */}
        {(()=>{

              <div style={{width:24,flex:"0 0 24px",display:"grid",placeItems:"center"}}>{icon}</div>

                <div style={{fontSize:10,fontWeight:700,color:GOLD,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{label}</div>
                <div style={{fontSize:15,fontWeight:900,color:"#ffe9a8",fontFamily:"Georgia,serif",lineHeight:1.15,whiteSpace:"nowrap"}}>{value}</div>
              </div>
              <svg width="12" height="12" viewBox="0 0 12 12" style={{flex:"0 0 12px"}}><path d="M2 4l4 4 4-4" fill="none" stroke={GOLD} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              {children}
            </div>
          );
          const sel={position:"absolute",inset:0,width:"100%",height:"100%",opacity:0,cursor:"pointer",fontSize:16};
          const IFlag=<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={GOLD} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-3 4 3 4H5"/></svg>;
          const ICards=<svg width="22" height="20" viewBox="0 0 26 22" fill="none" stroke={GOLD} strokeWidth="1.8" strokeLinejoin="round"><rect x="2" y="7" width="10" height="13" rx="2" transform="rotate(-14 7 13)"/><rect x="8" y="5" width="10" height="13" rx="2" transform="rotate(-4 13 11)"/><rect x="14" y="5" width="10" height="13" rx="2" transform="rotate(8 19 11)"/></svg>;
          const IClock=<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={GOLD} strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9"/><path d="M12 13l3 2"/><path d="M9 2h6"/><path d="M12 2v3"/><path d="M19 5l-1.5 1.5"/></svg>;
          const endVal=em==="8games"?(L?"จำนวนเกม":"Games"):(th>=1000?(th/1000)+"K":String(th));
          return (
            <div style={{display:"flex",gap:6,marginBottom:"0.8rem"}}>
              <Card icon={IFlag} label={L?"จบเกมเมื่อ":"End when"} value={endVal}>
                <select value={em==="8games"?"8games":String(th)} onChange={e=>{const v=e.target.value;if(v==="8games")setEm("8games");else{setEm("threshold");setTh(+v);}}} style={sel}>
                  <option value="8games">{L?"จำนวนเกม":"By games"}</option>
                  {[500,700,900,1000].map(v=><option key={v} value={String(v)}>{L?"ถึง ":"Score "}{v>=1000?(v/1000)+"K":v}</option>)}
                </select>
              </Card>
              <Card icon={ICards} label={L?"จำนวนเกม":"Games"} value={numGames+" "+(L?"เกม":"")} dim={em!=="8games"}>
                <select value={numGames} onChange={e=>{setNumGames(+e.target.value);setEm("8games");}} style={sel}>

              <Card icon={IClock} label={L?"โชว์ไพ่":"Show cards"} value={showSec+" "+(L?"วิ":"s")}>
                <select value={showSec} onChange={e=>setShowSec(+e.target.value)} style={sel}>
                  {[1,2,3,4,5].map(v=><option key={v} value={v}>{v} {L?"วิ":"sec"}</option>)}
                </select>
              </Card>
            </div>
          );
        })()}

        {/* v0821.29-dev: mode cards side-by-side (A: keep online above the fold) */}
        <div style={{display:"flex",gap:8}}>
          <div onClick={start} style={{flex:1,minWidth:0,position:"relative",borderRadius:16,overflow:"hidden",border:"2.5px solid #b4831a",boxShadow:"0 4px 0 #241203, 0 7px 14px rgba(0,0,0,0.35)",cursor:"pointer"}}>
            <img src={JM_VSBOT} style={{width:"100%",height:104,objectFit:"cover",display:"block"}}/>
            <div style={{position:"absolute",left:0,right:0,bottom:0,background:"linear-gradient(0deg,rgba(20,10,2,0.94),rgba(20,10,2,0))",color:"#ffe9a8",fontSize:12.5,fontWeight:800,textAlign:"center",padding:"14px 2px 5px",textShadow:"0 1px 2px #000",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>

          </div>
        </div>
        <div style={{textAlign:"center",fontSize:10,color:"#c9a86a",marginTop:8}}>{window.__JM_VER||""}</div>
      </div>
    </div>
  );
}

// ── GAME OVER ──────────────────────────────────────────────────
function GameOver({players,totals,lang,history,onAgain,onHome,showCoin,coinMult,getLog}){
  const confetti=React.useMemo(()=>Array(26).fill(0).map((_,i)=>({l:Math.random()*100,d:2.2+Math.random()*2.5,dl:Math.random()*1.6,e:["🎉","✨","🐷","🃏","💰"][i%5]})),[]);
  const L=lang==="th";
  const [showHist,setShowHist]=useState(false);
  const [logCopied,setLogCopied]=useState(false);
  const copyLog=()=>{ // full match log survives here until "Play Again" resets it
    const txt=(getLog&&getLog())||"(ยังไม่มีข้อมูล)";
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(()=>setLogCopied(true)).catch(()=>setLogCopied(true));
    else setLogCopied(true);
    setTimeout(()=>setLogCopied(false),1800);
  };
  const cc=(showCoin&&typeof coinCalc==="function")?coinCalc(totals,coinMult):null;
  const s=[...players.map((p,i)=>({...p,score:totals[i],h:toH(totals[i]),coin:cc?cc.net[i]:null,coinRake:cc?cc.rake[i]:0}))].sort((a,b)=>b.score-a.score);
  const COLW=cc?"repeat(4,minmax(46px,auto))":"repeat(3,minmax(48px,auto))";
  return (
    <div style={{minHeight:"100vh",height:"100dvh",background:"#08251b",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"calc(1rem + env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom))",overflowY:"auto"}}>
      {confetti.map((c,i)=><span key={i} className="confetti" style={{left:c.l+"%",animationDuration:c.d+"s",animationDelay:c.dl+"s"}}>{c.e}</span>)}
      <div style={{width:"100%",maxWidth:420,background:"#0b3d2e",borderRadius:16,padding:"1.5rem",border:"2px solid #d4af37",boxShadow:"0 4px 24px rgba(0,0,0,0.45)",textAlign:"center",marginTop:"0.5rem",marginBottom:"0.5rem"}}>
        <div style={{fontSize:38,marginBottom:8}}>🏆</div>
        <div style={{fontSize:24,fontWeight:700,color:"#f4d47a",fontFamily:"Georgia,serif",marginBottom:4}}>{L?"จบเกม!":"Game Over!"}</div>
        <div style={{fontSize:15,color:"#a7f3d0",marginBottom:"1.2rem"}}>{L?"ผู้ชนะ":"Winner"}: {s[0].name}</div>
        {(()=>{
          const spreads=calcSpread(s.map(p=>p.h));
          const medals=["🥇","🥈","🥉"];
          const PigFace=()=>(
            <svg width="28" height="28" viewBox="0 0 60 60">
              <ellipse cx="30" cy="32" rx="24" ry="22" fill="#f4a9b0"/>
              <ellipse cx="12" cy="26" rx="8" ry="10" fill="#f4a9b0"/>
              <ellipse cx="48" cy="26" rx="8" ry="10" fill="#f4a9b0"/>
              <ellipse cx="12" cy="26" rx="5" ry="7" fill="#f08898"/>
              <ellipse cx="48" cy="26" rx="5" ry="7" fill="#f08898"/>
              <circle cx="22" cy="28" r="5" fill="#fff"/>
              <circle cx="38" cy="28" r="5" fill="#fff"/>
              <circle cx="22" cy="29" r="3" fill="#1a1a1a"/>
              <circle cx="38" cy="29" r="3" fill="#1a1a1a"/>
              <circle cx="21" cy="27" r="1" fill="#fff"/>
              <circle cx="37" cy="27" r="1" fill="#fff"/>
              <ellipse cx="19" cy="36" rx="4" ry="2.5" fill="#f0607a" fillOpacity="0.5"/>
              <ellipse cx="41" cy="36" rx="4" ry="2.5" fill="#f0607a" fillOpacity="0.5"/>
              <ellipse cx="30" cy="40" rx="8" ry="6" fill="#e88090"/>
              <circle cx="27" cy="41" r="2" fill="#c0607a"/>
              <circle cx="33" cy="41" r="2" fill="#c0607a"/>
              <path d="M24 48 Q30 53 36 48" fill="none" stroke="#c0607a" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          );
          const hd=(t)=><span style={{fontSize:9,fontWeight:700,color:"#8fb0a1",textAlign:"right"}}>{t}</span>;
          return (<React.Fragment>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0 16px 4px"}}>
              <span style={{fontSize:9,fontWeight:700,color:"#8fb0a1"}}>{L?"ผู้เล่น":"Player"}</span>
              <div style={{display:"grid",gridTemplateColumns:COLW,gap:2}}>
                {hd(L?"คะแนน":"Score")}{hd(L?"หลัก":"Units")}{hd(L?"ได้เสีย":"±Units")}{cc?hd("💰 coin"):null}
              </div>
            </div>
            {s.map((p,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 12px 11px 16px",marginBottom:7,background:i===0?"rgba(212,175,55,0.16)":"rgba(255,255,255,0.06)",borderRadius:10,border:"1.5px solid",borderColor:i===0?"#d4af37":"rgba(212,175,55,0.3)"}}>
              <div style={{display:"flex",gap:8,alignItems:"center",minWidth:0}}>
                {i<3
                  ? <span style={{fontSize:22}}>{medals[i]}</span>
                  : <PigFace/>
                }
                <span style={{color:"#fff",fontSize:14,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:COLW,gap:2,alignItems:"center"}}>
                <span style={{fontSize:14,fontWeight:700,textAlign:"right",color:p.score>0?"#34d399":p.score<0?"#f87171":"#9fb8aa"}}>{p.score>0?"+":""}{p.score}</span>
                <span style={{fontSize:14,fontWeight:600,textAlign:"right",color:"#9fb8aa"}}>{p.h>0?"+":""}{p.h}</span>
                <span style={{fontSize:14,fontWeight:600,textAlign:"right",color:spreads[i]>0?"#34d399":spreads[i]<0?"#f87171":"#9fb8aa"}}>{spreads[i]>0?"+":""}{spreads[i]}</span>
                {cc?<span title={p.coinRake?("ต๋ง "+p.coinRake):""} style={{fontSize:14,fontWeight:800,textAlign:"right",color:p.coin>0?"#34d399":p.coin<0?"#f87171":"#9fb8aa"}}>{p.coin>0?"+":""}{p.coin.toLocaleString()}</span>:null}
              </div>
            </div>
            ))}

// ── GAME STATE ─────────────────────────────────────────────────
function mkRound(dealer,totals,gameNum){
  return{hands:deal(),trick:[],wonCards:[[],[],[],[]],wonTricks:[0,0,0,0],
    leadIdx:dealer,curIdx:dealer,trickNum:1,phase:"playing",
    toast:{msg:"",cards:[]},totals:totals||[0,0,0,0],gameNum:gameNum||1,
    firstDealer:dealer,gameOver:false,selected:null,errMsg:"",
    // Card counting state:
    playLog:[],  // every card played: {pi, card, trickNum, leadSuit}
    voids:[{},{},{},{}]};  // voids[playerIdx][suit]=true if that player can't follow suit
}
function gReduce(S,A){
  if(A.type==="INIT")return mkRound(A.dealer,A.totals,A.gameNum);
  if(A.type==="PLAY"){
    if(S.phase!=="playing")return S;
    const ci=S.curIdx;
    const nh=S.hands.map((h,i)=>i===ci?h.filter(c=>c.key!==A.card.key):h);
    const nt=[...S.trick,{playerIdx:ci,card:A.card}];
    const leadSuit=nt[0].card.suit;
    // Track this card in playLog
    const newLog=[...S.playLog,{pi:ci,card:A.card,trickNum:S.trickNum,leadSuit}];
    // Track voids: if player didn't follow lead suit, they're void in it
    const newVoids=S.voids.map((v,i)=>{
      if(i===ci&&A.card.suit!==leadSuit&&S.trick.length>0){
        return {...v,[leadSuit]:true};
      }
      return v;
    });
    if(nt.length===4){
      const ls=nt[0].card.suit, wi=trickWin(nt,ls);
      const sc=nt.map(x=>x.card).filter(isSC);
      const nw=S.wonCards.map((w,i)=>i===wi?[...w,...sc]:w);
      const nwt=S.wonTricks.map((w,i)=>i===wi?w+1:w);
      const msg=sc.length?(A.names[wi]+" ได้ไพ่กองนี้! 🃏"):(A.names[wi]+" ได้ไพ่กองนี้");
      return{...S,hands:nh,trick:nt,wonCards:nw,wonTricks:nwt,phase:"trickDone",toast:{msg,cards:sc},selected:null,playLog:newLog,voids:newVoids};
    }
    return{...S,hands:nh,trick:nt,curIdx:(ci+1)%4,selected:null,playLog:newLog,voids:newVoids};
  }
  if(A.type==="CLEAR"){
    if(S.phase!=="trickDone"||!S.trick.length)return S; // stale/duplicate CLEAR — ignore
    const wi=trickWin(S.trick,S.trick[0].card.suit);
    if(S.trickNum>=13){
      // Recompute wonTricks from wonCards to avoid any stale state issues
      // A player won a trick if they have any cards in wonCards OR wonTricks > 0
      // Use wonTricks from state (updated by PLAY) but verify against hand sizes
      // The safest: use S.wonTricks which was set by the last PLAY action
      const safeWonTricks=S.wonTricks.slice();
      const rs=S.wonCards.map((w,i)=>calcScore(w,safeWonTricks[i]));
      const nt=S.totals.map((s,i)=>s+rs[i]);
      const gn=S.gameNum, maxG=A.numGames||8;
      const over=A.endMode==="8games"?gn>=maxG:nt.some(s=>Math.abs(s)>=A.threshold);
      if(over)return{...S,trick:[],toast:{msg:"",cards:[]},totals:nt,gameOver:true,lastRoundScores:rs};
      const nd=(S.firstDealer+1)%4;
      // Show round summary for 3 seconds before starting new game
      return{...S,trick:[],toast:{msg:"",cards:[]},
        phase:"roundSummary",roundScores:rs,totals:nt,
        nextDealer:nd,nextGameNum:gn+1,selected:null,errMsg:""};
    }
    return{...S,trick:[],trickNum:S.trickNum+1,curIdx:wi,leadIdx:wi,phase:"playing",toast:{msg:"",cards:[]},selected:null};
  }
  if(A.type==="SEL")return{...S,selected:A.val,errMsg:""};
  if(A.type==="ERR")return{...S,errMsg:A.msg};
  return S;
}
// SURRENDER AUTOPLAY: bot (Lv3 MC, same as table bots) plays EVERY remaining hand —
// including the quitter's — until the CURRENT game completes, then we settle at the
// real resulting totals. Honest resolution: a doomed hand realizes its loss, a good
// hand realizes its win; nothing to game. Synchronous by design (runs while the
// surrender modal shows busy); mcMs kept small to bound worst case ≈ 52×mcMs.
function simFinishGame(S0,cfg,mcMs){
  let S=S0,guard=0;
  const ms=mcMs||120;
  while(guard++<240){
    if(S.gameOver)return{totals:S.totals,matchOver:true};
    if(S.phase==="roundSummary")return{totals:S.totals,matchOver:false};
    if(S.phase==="trickDone"){S=gReduce(S,{type:"CLEAR",endMode:cfg.endMode,threshold:cfg.threshold,numGames:cfg.numGames});continue;}
    if(S.phase!=="playing")return null;
    const lead=S.trick.length?S.trick[0].card.suit:null;
    const card=botPlayMC(S.hands[S.curIdx],lead,S.trick,S.wonCards,S.totals,S.curIdx,S.playLog,S.voids,ms);
    if(!card)return null;
    S=gReduce(S,{type:"PLAY",card,names:["P0","P1","P2","P3"]});
  }
  return null;
}

// ── ONLINE: perspective + cfg helpers ─────────────────────────
// Rotate state so render position 0 = my actual seat (bottom). Engine always
// uses real seats; this is render-only. Opponents already render as card backs.
function permuteState(S,mySeat){
  if(!S||!S.hands||!mySeat)return S;
  const m=mySeat,idx=p=>(m+p)%4,inv=a=>(a-m+4)%4;
  const pm=arr=>arr?[0,1,2,3].map(p=>arr[idx(p)]):arr;
  return {...S,
    hands:pm(S.hands),wonCards:pm(S.wonCards),wonTricks:pm(S.wonTricks||[0,0,0,0]),totals:pm(S.totals),
    curIdx:inv(S.curIdx),leadIdx:inv(S.leadIdx),
    trick:(S.trick||[]).map(t=>({...t,playerIdx:inv(t.playerIdx)})),
    roundScores:pm(S.roundScores),lastRoundScores:pm(S.lastRoundScores)};
}
function seatsToCfg(seats,mult,seed){
  // mult picks the character MIX per tier; seed (host-rolled, broadcast in the start
  // payload) shuffles WHICH seat each character takes — random per match, yet every
  // client derives identical names/skills from the same seed.
  const lu=seededShuffle(botLineup(mult||100),seed==null?1:seed); let bi=0;
  return {players:seats.map(s=>s.type==="bot"
      ?(()=>{const bid=lu[(bi++)%lu.length];return {name:botChar(bid).name,isBot:true,botLevel:3,botChar:bid};})()
      :{name:s.name||"?",isBot:false,botLevel:0}),
    endMode:"8games",threshold:300,numGames:8,showSec:1.4};
}

// ── GAME COMPONENT ─────────────────────────────────────────────
function HandCards({hands0,ls,trick,curIdx,phase,selected,ap,cw,ch,avail,corner}){
  const cards=[...hands0].sort((a,b)=>{const so=["♠","♥","♦","♣"];const si=so.indexOf(a.suit)-so.indexOf(b.suit);return si||RO[a.rank]-RO[b.rank];});
  const n=cards.length;
  const W=cw||48,H=ch||68;
  if(n===0)return <div style={{height:H}}/>;
  const aw=avail||((typeof window!=="undefined"?window.innerWidth:375)-16);
  const totalW=n*W;
  const needOverlap=totalW>aw;
  let ov=needOverlap?Math.round((n*W-aw)/(n-1)):0;
  const maxOv=Math.round(W*0.78);
  let scroll=false;
  if(ov>maxOv){ov=maxOv;scroll=true;} // even max overlap won't fit → allow horizontal scroll
  const justify=(needOverlap||scroll)?"flex-start":"center";
  const selectedCard=selected!==null&&selected!==undefined?hands0[selected]:null;
  return (
    <div className={scroll?"hand-scroll":""} style={{display:"flex",width:"100%",justifyContent:justify,paddingBottom:2,paddingTop:14,boxSizing:"border-box",overflowX:scroll?"auto":"visible"}}>
      {cards.map((card,idx)=>{
        const vld=getValid(hands0,ls,trick);
        const ok=vld.some(c=>c.key===card.key);
        const myTurn=curIdx===0&&phase==="playing";
        const oi=hands0.findIndex(c=>c.key===card.key);
        const isSel=selectedCard&&selectedCard.key===card.key&&selected===oi;
        return (
          <div key={card.key} style={{marginLeft:idx>0?-ov:0,zIndex:isSel?20:idx,flexShrink:0}}>
            <CF card={card} sel={isSel} onClick={()=>{if(myTurn)ap({type:"SEL",val:isSel?null:oi});}} dis={!myTurn||!ok} w={W} h={H} corner={corner}/>
          </div>
        );
      })}
    </div>
  );
}

function Game({cfg,lang,setLang,net,onExit,onGameStats,onHome,resume,onMatchCoins,coins,prof}){
  const mySeat=net?net.mySeat:0;
  const isClient=!!(net&&net.role==="client");
  const isHost=!!(net&&net.role==="host");
  const sRef=useRef(isClient?{phase:"waiting",hands:null}:((!net&&resume&&resume.S)||mkRound(0,[0,0,0,0],1)));
  const [showHist,setShowHist]=useState(false);
  const [copyMsg,setCopyMsg]=useState(false);
  const [aiThinking,setAiThinking]=useState(false);
  const histRef=useRef((!net&&resume&&resume.hist)||[]);
  const gameLogRef=useRef((!net&&resume&&resume.gameLog)||[]); // full move log for export
  const [,fr]=useState(0);
  const rd=()=>fr(x=>x+1);
  const tmr=useRef(null);
  const bk=useRef("");
  function ap(a){sRef.current=gReduce(sRef.current,a);rd();}

  // ── STATS: commit XP + skill stats once per finished game (roundSummary or gameOver) ──
  const statFired=useRef((!net&&resume&&resume.statFired)||{});
  const wasOverStat=useRef(!!(!net&&resume&&resume.wasOver));
  useEffect(()=>{
    const Sr=sRef.current;if(!Sr||!onGameStats)return;
    if(wasOverStat.current&&!Sr.gameOver){wasOverStat.current=false;statFired.current={};coinFired.current=false;}
    if(Sr.gameOver)wasOverStat.current=true;
    const summary=Sr.phase==="roundSummary"&&Sr.roundScores;
    const over=Sr.gameOver&&Sr.lastRoundScores;
    if(!summary&&!over)return;
    const me=mySeat;
    if(!cfg.players[me]||cfg.players[me].isBot)return; // only the human on this device
    const key=(Sr.gameNum||0)+(over?"F":"S");
    if(statFired.current[key])return;
    statFired.current[key]=1;
    const rs=summary?Sr.roundScores:Sr.lastRoundScores;
    const myWon=Sr.wonCards[me]||[];
    const superSlam=rs[me]===788;
    const matchDone=!!over;
    const bonuses=skillBonuses(Sr.playLog,me,myWon);
    const xpAdd=xpForGame(rs[me],rs,myWon,matchDone,cfg.numGames||8,bonuses);
    const deltas=statDeltas(myWon,rs[me],rs,superSlam);
    // If the commit fails (offline / DB error), clear the marker so it retries
    // instead of silently losing the game's XP forever.
    const r=onGameStats(xpAdd,deltas);
    if(r&&r.then)r.then(ok=>{if(ok===false)delete statFired.current[key];}).catch(()=>{delete statFired.current[key];});
    // COIN: settle once per finished match. Offline = this device writes everything.
    // Online (beta) = EACH human device writes only ITS OWN seat row; the host also
    // writes the pooled BOT row + HOUSE rake. Totals/me here are ABSOLUTE seats.
    if(matchDone&&onMatchCoins&&!coinFired.current){
      coinFired.current=true;
      onMatchCoins(Sr.totals,me,net?{room:String(net.room||""),isHost:net.role!=="client",players:cfg.players}:null,(cfg&&cfg.coinMult)||COIN_MULT);
    }
  });
  const coinFired=useRef(false);
  // SEAT TAKEOVER (v0821.13): a vanished CLIENT used to freeze the whole table forever
  // (auto-play runs only on the turn owner's device). Host-side: if a remote human's
  // turn stalls >45s (their own device auto-plays at ~25s, so 45s = device truly gone)
  // the host marks the seat "subbed" and its bots play that hand for the REST OF THE
  // MATCH (Lv3 MC). Subbed list rides along on every state frame for the 🤖 badge.
  const subbed=useRef([false,false,false,false]);
  const subView=useRef([false,false,false,false]); // client-side copy from frames
  const stallRef=useRef({k:"",ts:0});
  useEffect(()=>{
    if(!net||isClient)return;
    const iv=setInterval(()=>{
      const S=sRef.current;
      if(!S||S.phase!=="playing")return;
      const i=S.curIdx;
      const k=i+"-"+S.trickNum+"-"+S.trick.length+"-"+S.gameNum;
      if(stallRef.current.k!==k){stallRef.current={k,ts:Date.now()};return;}
      if(Date.now()-stallRef.current.ts<45000)return;
      if(i===mySeat||cfg.players[i].isBot||subbed.current[i])return;
      subbed.current=subbed.current.map((x,j)=>j===i?true:x);
      gameLogRef.current.push("SUB seat "+i+" ("+cfg.players[i].name+") — stalled, bot takes over");
      rd(); // re-run the bot effect so the substitute plays immediately
    },5000);
    return()=>clearInterval(iv);
  },[]);
  const isBotSeat=(i)=>!!(cfg.players[i]&&cfg.players[i].isBot)||!!subbed.current[i];
  // HOST-GONE WATCHDOG (v0821.11): host heartbeats every 3s; transport auto-reconnect
  // takes at most ~27s. 30s of silence on a client mid-match therefore means the host
  // is truly gone (crash / app closed / fled) → settle the completed games and show a
  // blocking modal with a home button instead of leaving the table frozen forever.
  const lastFrameAt=useRef(Date.now());
  const abandonFired=useRef(false);
  const [hostGone,setHostGone]=useState(null); // {games,net?,error?,pending?}
  useEffect(()=>{
    if(!isClient||(cfg&&cfg.practice))return;
    const iv=setInterval(()=>{
      if(abandonFired.current||coinFired.current)return;
      const S=sRef.current;if(!S||S.gameOver)return;
      if(Date.now()-lastFrameAt.current<30000)return;
      abandonFired.current=true;coinFired.current=true;
      const games=(S.gameNum||1)-1;
      if(games<1||!onMatchCoins){setHostGone({games:0});return;}
      setHostGone({games,pending:true});
      Promise.resolve(onMatchCoins(S.totals,mySeat,{room:String(net.room||""),isHost:false,players:cfg.players,abandoned:true,games},(cfg&&cfg.coinMult)||COIN_MULT))
        .then(()=>setHostGone(h=>h?{...h,pending:false}:h))
        .catch(()=>setHostGone(h=>h?{...h,pending:false,error:true}:h));
    },5000);
    return()=>clearInterval(iv);
  },[]);

  useEffect(()=>{
    if(isClient)return; // client waits for host frames; engine runs on host/local
    if(!net&&resume&&resume.S){rd();return;} // resumed game: state already restored — do NOT re-INIT
    ap({type:"INIT",dealer:0,totals:[0,0,0,0],gameNum:1});
  },[]);

  useEffect(()=>{
    if(isClient)return;
    const S=sRef.current;
    if(!S||!S.hands||S.phase!=="playing")return;
    // Don't let bot fire until game is properly initialized (gameNum matches)
    if(S.gameNum<1)return;
    if(!isBotSeat(S.curIdx))return;
    const k=S.curIdx+"-"+S.trickNum+"-"+S.trick.length+"-"+S.gameNum;
    // bk.current marks keys already PLAYED (set inside the timeout), not merely
    // scheduled — cleanup clears the pending timer on every re-render, so an
    // unplayed key must be rescheduled or the bot deadlocks.
    if(bk.current===k)return;
    const mb=mcBudget(cfg.coinMult); // richer table => deeper MC (see mcBudget)
    clearTimeout(tmr.current);
    tmr.current=setTimeout(()=>{
      const S2=sRef.current;
      if(!S2||S2.phase!=="playing"||!isBotSeat(S2.curIdx))return;
      const k2=S2.curIdx+"-"+S2.trickNum+"-"+S2.trick.length+"-"+S2.gameNum;
      if(bk.current===k2)return;
      bk.current=k2;
      const lvl=cfg.players[S2.curIdx].isBot?cfg.players[S2.curIdx].botLevel:3; // subbed human → Lv3 MC
      const bc=botChar(cfg.players[S2.curIdx].isBot?cfg.players[S2.curIdx].botChar:"thep"); // takeover subs play at max
      if(lvl===3&&bc.blur&&Math.random()<bc.blur){
        // HEURISTIC BLUR: weak characters sometimes skip MC and play the plain heuristic —
        // cheap, natural-looking mistakes instead of hand-written dumb logic.
        const card=botPlay(S2.hands[S2.curIdx],S2.trick.length?S2.trick[0].card.suit:null,S2.trick,S2.wonCards,S2.totals,S2.curIdx,S2.playLog,S2.voids);
        setTimeout(()=>{ // same min-turn pacing as the MC path — blur must not be a tell
          const S4=sRef.current;
          if(!S4||S4.phase!=="playing"||S4.curIdx!==S2.curIdx)return;
          ap({type:"PLAY",card,names:cfg.players.map(p=>p.name)});
        },Math.max(0,650-mb.pace));
      } else if(lvl===3){
        setAiThinking(true);
        setTimeout(()=>{
          const S3=sRef.current;
          if(!S3||S3.phase!=="playing"||S3.curIdx!==S2.curIdx){setAiThinking(false);return;}
          const t0=Date.now();
          const card=botPlayMC(S3.hands[S3.curIdx],S3.trick.length?S3.trick[0].card.suit:null,S3.trick,S3.wonCards,S3.totals,S3.curIdx,S3.playLog,S3.voids,mb.ms,Math.max(30,Math.round(mb.deals*(bc.dealsX||1))),{hunt:!!bc.hunt,antiLast:!!bc.antiLast,blowGuard:bc.blowGuard||false,bayes:bc.bayes?{humans:cfg.players.map(pl=>!pl.isBot)}:false,humans:cfg.players.map(pl=>!pl.isBot),campaign:!!bc.campaign,campQ:bc.campQ,huntP:bc.huntP,slamDef:bc.slamDef||false,hlak:bc.hlak||false});
          // MIN TURN TIME (v0821.18): the MC budget is a CEILING — forced plays and
          // cheap late tricks finish in milliseconds and looked jarringly fast at
          // x500. Pad the play-back so every turn takes ≥ ~0.68s from schedule;
          // think quality untouched, only the rhythm is evened out.
          const wait=Math.max(0,650-mb.pace-(Date.now()-t0)); // v0821.20: floor ~680ms — midpoint of pre-.18 instant plays and the 1.13s floor
          setTimeout(()=>{
            setAiThinking(false);
            const S4=sRef.current;
            if(!S4||S4.phase!=="playing"||S4.curIdx!==S2.curIdx)return; // state moved → effect reschedules
            ap({type:"PLAY",card,names:cfg.players.map(p=>p.name)});
          },wait);
        },30);
      } else if(lvl===4){
        setAiThinking(true);
        botPlayClaude(S2.hands[S2.curIdx],S2.trick.length?S2.trick[0].card.suit:null,S2.trick,S2.wonCards,S2.totals,S2.curIdx,cfg.players.map(p=>p.name))
          .then(card=>{
            setAiThinking(false);
            const S3=sRef.current;
            if(S3&&S3.phase==="playing"&&S3.curIdx===S2.curIdx)
              ap({type:"PLAY",card,names:cfg.players.map(p=>p.name)});
          });
      } else {
        const card=botPlay(S2.hands[S2.curIdx],S2.trick.length?S2.trick[0].card.suit:null,S2.trick,S2.wonCards,S2.totals,S2.curIdx,S2.playLog,S2.voids);

  // ── OPPONENT CARD BACK ROW ───────────────────────────────────
  function OppCards({count,rot,max}){
    const n=Math.min(count,max||13);
    const ov=n>6?Math.round((n*Math.round(20*sf)-Math.round(60*sf))/(n-1)):0;
    return (
      <div style={{display:"flex",flexDirection:rot?"column":"row",alignItems:"center",overflow:"hidden"}}>
        {Array(n).fill(0).map((_,i)=>(
          <div key={i} style={rot?{marginTop:i>0?-ov:0}:{marginLeft:i>0?-ov:0}}>
            <CB w={Math.round(18*sf)} h={Math.round(26*sf)} rot={rot?90:0}/>
          </div>
        ))}
      </div>
    );
  }

            const row=Math.floor(idx/3),col=idx%3;
            let pi=-1;
            if(row===0&&col===1)pi=2;
            if(row===1&&col===0)pi=3;
            if(row===1&&col===2)pi=1;
            if(row===2&&col===1)pi=0;

// COIN_ON (=__JM_DEV). Ledger-first design: coin_tx is the truth, players.coins is
// a cache. System accounts: 'BOT' (one pooled dealer tray) + 'HOUSE' (rake sink).
// Every match nets to zero across all accounts (double-entry). Prod launch = flip
// COIN_ON after resetting the coin tables.
const COIN_ON=(typeof window!=="undefined")&&!!window.__JM_DEV;
const COIN_MULT=100;    // ×100 per หลัก (A 2026-08-13)
const COIN_RAKE=0.15;   // 15% rake on WINNING seats → HOUSE
const COIN_GRANT=10000; // first-entry grant — generous first impression; daily
// refill (floor 2,000) is where the tightness lives, per A's decision 2026-08-14.
// Table tiers: min = 50×mult (≈ half of the p99 single-match loss at that table);
// playing BELOW your bankroll is always allowed (min is a floor, not a ceiling).
// bot:false tiers are human-only — bot tables capped at ×500 to limit BOT-tray farming.
const COIN_TABLES=[
  {mult:100,  min:0,     bot:true},
  {mult:200,  min:10000, bot:true},
  {mult:500,  min:25000, bot:true},
  {mult:1000, min:50000, bot:false},
  {mult:2000, min:100000,bot:false},
  {mult:5000, min:250000,bot:false},
  {mult:10000,min:500000,bot:false}

// Last-played table memory (v0821.22): default the picker to the table played last
// time; if the balance has since dropped below its min, fall back to the richest
// affordable tier BELOW it — never upward, no surprise stakes.
function lastTblMult(coins,botOnly){
  let want=100; try{want=parseInt(localStorage.getItem("jm_lastTbl")||"100",10)||100;}catch(e){}
  let best=100;
  for(const t of COIN_TABLES){
    if(botOnly&&!t.bot)continue;
    if(t.mult>want)continue;
    if(t.min>0&&(coins==null||coins<t.min))continue;
    if(t.mult>best)best=t.mult;
  }
  return best;
}
const COIN_REFILL=2000; // broke → daily TOP-UP TO this floor (not +flat): the ledger
// can go negative by design, and a flat +2,000 is smaller than a single bad match
// (p95 ≈ −2,100) — a deep-negative player would be locked out for days. Topping up
// to the floor gives everyone exactly one comeback stake per day. REFILL mints coin
// anyway, so table zero-sum is unaffected.

// compact coin display (A's rule): <10,000 full with comma ("8,000"); 10K-999K → "12K"/"12.5K"/"125K"; ≥1M → "1.2M"
function fmtCoin(n){
  if(n==null)return "";
  const neg=n<0,a=Math.abs(n);let s;
  if(a<10000)s=a.toLocaleString();
  else if(a<999500){const k=a/1000;s=(k>=100?Math.round(k):Math.round(k*10)/10)+"K";}
  else {const m=a/1000000;s=(m>=100?Math.round(m):Math.round(m*10)/10)+"M";}
  return (neg?"-":"")+s;
}

async function coinDaily(code){

      return {balance:bal,granted:true,broke:false};

        refilled=true;

  }catch(e){return {error:coinErrMsg(e)};}

// pure per-seat coin math from final totals (shared by settle + game-over display)
function coinCalc(totals,mult){
  const m=mult||COIN_MULT;
  const hs=totals.map(toH);
  const sum=hs.reduce((a,b)=>a+b,0);
  const gross=hs.map(h=>(4*h-sum)*m);
  const rake=gross.map(g=>g>0?Math.round(g*COIN_RAKE):0);
  const net=gross.map((g,i)=>g-rake[i]);
  return {hs,gross,rake,net};
}

async function coinSettleOffline(totals,humanSeat,code,games,mult){

    const rakeTotal=rake.reduce((a,b)=>a+b,0);
    const bal=await coinWrite(code,net[humanSeat],"SETTLE",matchId,{h:hs[humanSeat],gross:gross[humanSeat],rake:rake[humanSeat],mult});
    await coinWrite("BOT",botNet,"SETTLE",matchId,{seats:hs.filter((_,i)=>i!==humanSeat)});

// HOST-ABANDON SETTLE (v0821.11): host vanished mid-match → settle the COMPLETED
// games only (totals exclude the in-progress game by design — totals update at game
// end). Each surviving device writes its OWN seat row; then, staggered by seat, the
// first one to find no BOT marker row for this room also writes BOT + HOUSE + coin_match
// (lowest surviving seat wins the race). KNOWN HOLE: the host's own human row cannot be
// written (his code lives only on his device) → match is NOT zero-sum; coin_match marks
// his seat code "?" for the ledger audit. Real fix = server-side settle (deferred).
async function coinSettleAbandon(totals,me,code,online,games,mult){

    await new Promise(r=>setTimeout(r,2000+me*4000)); // seat-staggered backup-writer race
    const c=await profClient();
    let done=false;
    try{
      const since=new Date(Date.now()-10*60*1000).toISOString();
      const {data}=await c.from("coin_tx").select("id").eq("code","BOT").eq("type","SETTLE").gte("created_at",since).contains("meta",{room:room,abandoned:true}).limit(1);
      done=!!(data&&data.length);
    }catch(e){}
    if(!done){
      const botSeats=(online.players||[]).map((p,i)=>p&&p.isBot?i:-1).filter(i=>i>=0);
      const botNet=botSeats.reduce((sum,i)=>sum+net[i],0);
      await coinWrite("BOT",botNet,"SETTLE",matchId,{room,seats:botSeats,online:true,abandoned:true});
      const rakeTotal=rake.reduce((a,b)=>a+b,0);
      if(rakeTotal)await coinWrite("HOUSE",rakeTotal,"RAKE",matchId,{room,online:true,abandoned:true});
      try{await c.from("coin_match").insert({match_id:matchId,mult,games:games,
        seats:totals.map((t,i)=>({seat:i,isBot:!!(online.players&&online.players[i]&&online.players[i].isBot),
